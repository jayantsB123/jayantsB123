name: Refresh profile visuals
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: profile-cycle-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh GitHub data and SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/render-profile.mjs --refresh
      - name: Verify generated assets
        run: node scripts/render-profile.mjs --check
      - name: Commit changed assets
        run: |
          git add config/profile-data.json assets/profile-cycle
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile visualizations'
          git push
