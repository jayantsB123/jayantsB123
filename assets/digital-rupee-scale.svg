<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 148" width="760" height="148" role="img" aria-labelledby="t"><title id="t">100M+ tokens in production, 100K+ redemptions per hour in UAT, 13M+ users in rollout scope</title><style>text{font-family:system-ui,sans-serif}.ey{font:600 12px monospace;letter-spacing:1.3px}.light{animation:reveal 1.8s ease-out both;stroke-dasharray:200;stroke-dashoffset:0}@keyframes reveal{from{stroke-dashoffset:200}}@media(prefers-reduced-motion:reduce){.light{animation:none}}</style><g transform="translate(0 0)"><rect x="1" y="1" width="248" height="146" rx="14" fill="#151724" stroke="#393a52"/><text x="18" y="30" class="ey" fill="#bfadff">PRODUCTION</text><text x="15" y="86" font-size="49" font-weight="700" fill="#f4f3ff">100M+</text><text x="18" y="117" font-size="15" fill="#d2d3e1">tokens in ICICI’s live base</text><path class="light" d="M18 134h198" stroke="#bfadff" stroke-width="2" style="animation-delay:0s"/></g><g transform="translate(255 0)"><rect x="1" y="1" width="248" height="146" rx="14" fill="#151724" stroke="#393a52"/><text x="18" y="30" class="ey" fill="#7de5ce">LOAD TEST · UAT</text><text x="15" y="86" font-size="49" font-weight="700" fill="#f4f3ff">100K+</text><text x="18" y="117" font-size="15" fill="#d2d3e1">redemptions per hour</text><path class="light" d="M18 134h198" stroke="#7de5ce" stroke-width="2" style="animation-delay:0.18s"/></g><g transform="translate(510 0)"><rect x="1" y="1" width="248" height="146" rx="14" fill="#151724" stroke="#393a52"/><text x="18" y="30" class="ey" fill="#ffca82">ROLLOUT SCOPE</text><text x="15" y="86" font-size="49" font-weight="700" fill="#f4f3ff">13M+</text><text x="18" y="117" font-size="15" fill="#d2d3e1">users in wallet rollout</text><path class="light" d="M18 134h198" stroke="#ffca82" stroke-width="2" style="animation-delay:0.36s"/></g></svg>
