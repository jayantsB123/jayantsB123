<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Four animated cards for life outside code: lifting, running, trekking and motorcycle touring.">
  <defs>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Roboto, Arial, sans-serif; font-weight: 700; font-size: 18px; fill: #e6edf3; letter-spacing: 3px; }
    .c { font-family: 'Segoe UI', Roboto, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
  </style>

  <!-- LIFT -->
  <g transform="translate(20,10)">
    <rect width="200" height="180" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="1" y="1" width="198" height="3" rx="1.5" fill="url(#cardEdge)"/>
    <ellipse cx="100" cy="112" rx="42" ry="5" fill="#000" opacity="0.5">
      <animate attributeName="rx" dur="1.6s" repeatCount="indefinite" values="42;30;42"/>
    </ellipse>
    <g transform="translate(100,72)">
      <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" values="100 72;100 52;100 72" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
      <rect x="-36" y="-3" width="72" height="6" rx="2" fill="#c9d1d9"/>
      <rect x="-48" y="-20" width="10" height="40" rx="3" fill="#ff9933"/>
      <rect x="-58" y="-13" width="8" height="26" rx="3" fill="#ffb86b"/>
      <rect x="38" y="-20" width="10" height="40" rx="3" fill="#ff9933"/>
      <rect x="50" y="-13" width="8" height="26" rx="3" fill="#ffb86b"/>
    </g>
    <text x="100" y="142" text-anchor="middle" class="t">LIFT</text>
    <text x="100" y="162" text-anchor="middle" class="c">progressive overload, always</text>
  </g>

  <!-- RUN -->
  <g transform="translate(240,10)">
    <rect width="200" height="180" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="1" y="1" width="198" height="3" rx="1.5" fill="url(#cardEdge)"/>
    <g transform="translate(100,74)">
      <ellipse rx="52" ry="28" fill="none" stroke="#21262d" stroke-width="12"/>
      <ellipse rx="52" ry="28" fill="none" stroke="#484f58" stroke-width="1.5" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" dur="1s" repeatCount="indefinite" values="0;-12"/>
      </ellipse>
      <circle r="4" fill="#3fb950" opacity="0.25"><animateMotion dur="3s" repeatCount="indefinite" begin="-0.45s" path="M -52 0 a 52 28 0 1 1 104 0 a 52 28 0 1 1 -104 0"/></circle>
      <circle r="5" fill="#3fb950" opacity="0.45"><animateMotion dur="3s" repeatCount="indefinite" begin="-0.25s" path="M -52 0 a 52 28 0 1 1 104 0 a 52 28 0 1 1 -104 0"/></circle>
      <circle r="7" fill="#3fb950"><animateMotion dur="3s" repeatCount="indefinite" path="M -52 0 a 52 28 0 1 1 104 0 a 52 28 0 1 1 -104 0"/></circle>
    </g>
    <text x="100" y="142" text-anchor="middle" class="t">RUN</text>
    <text x="100" y="162" text-anchor="middle" class="c">steady pace beats a fast start</text>
  </g>

  <!-- TREK -->
  <g transform="translate(460,10)">
    <rect width="200" height="180" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="1" y="1" width="198" height="3" rx="1.5" fill="url(#cardEdge)"/>
    <g transform="translate(100,80)">
      <polygon points="-62,34 -22,-18 0,6 26,-40 64,34" fill="#21262d"/>
      <polygon points="-46,34 -6,-6 32,34" fill="#30363d"/>
      <polygon points="26,-40 17,-26 26,-30 35,-26" fill="#e6edf3"/>
      <line x1="26" y1="-40" x2="26" y2="-58" stroke="#c9d1d9" stroke-width="2"/>
      <polygon points="26,-58 40,-53 26,-48" fill="#3fb950">
        <animate attributeName="points" dur="1.2s" repeatCount="indefinite" values="26,-58 40,-53 26,-48;26,-58 38,-56 26,-48;26,-58 40,-53 26,-48"/>
      </polygon>
      <circle r="5" fill="#ff9933">
        <animateMotion dur="5s" repeatCount="indefinite" keyTimes="0;0.85;1" keyPoints="0;1;1" calcMode="linear" path="M -52 34 L -20 6 L 2 16 L 24 -36"/>
      </circle>
    </g>
    <text x="100" y="142" text-anchor="middle" class="t">TREK</text>
    <text x="100" y="162" text-anchor="middle" class="c">summit first, commit later</text>
  </g>

  <!-- RIDE -->
  <g transform="translate(680,10)">
    <rect width="200" height="180" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="1" y="1" width="198" height="3" rx="1.5" fill="url(#cardEdge)"/>
    <line x1="20" y1="112" x2="180" y2="112" stroke="#484f58" stroke-width="2" stroke-dasharray="12 10">
      <animate attributeName="stroke-dashoffset" dur="0.6s" repeatCount="indefinite" values="0;-22"/>
    </line>
    <g transform="translate(100,82)">
      <animateTransform attributeName="transform" type="translate" dur="0.5s" repeatCount="indefinite" values="100 82;100 80.5;100 82"/>
      <g transform="translate(-32,16)">
        <circle r="15" fill="none" stroke="#c9d1d9" stroke-width="3"/>
        <g><animateTransform attributeName="transform" type="rotate" dur="0.7s" repeatCount="indefinite" from="0" to="360"/>
          <line x1="-15" y1="0" x2="15" y2="0" stroke="#8b949e" stroke-width="2"/>
          <line x1="0" y1="-15" x2="0" y2="15" stroke="#8b949e" stroke-width="2"/>
        </g>
      </g>
      <g transform="translate(32,16)">
        <circle r="15" fill="none" stroke="#c9d1d9" stroke-width="3"/>
        <g><animateTransform attributeName="transform" type="rotate" dur="0.7s" repeatCount="indefinite" from="0" to="360"/>
          <line x1="-15" y1="0" x2="15" y2="0" stroke="#8b949e" stroke-width="2"/>
          <line x1="0" y1="-15" x2="0" y2="15" stroke="#8b949e" stroke-width="2"/>
        </g>
      </g>
      <path d="M -32 16 L -10 -8 L 16 -8 L 32 16" fill="none" stroke="#ff9933" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 16 -8 L 22 -20 L 34 -20" fill="none" stroke="#c9d1d9" stroke-width="3" stroke-linecap="round"/>
      <rect x="-8" y="-18" width="24" height="10" rx="4" fill="#ffb86b"/>
      <rect x="-26" y="-12" width="16" height="5" rx="2.5" fill="#c9d1d9"/>
      <line x1="-62" y1="-4" x2="-46" y2="-4" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" opacity="0.7"><animate attributeName="opacity" dur="0.6s" repeatCount="indefinite" values="0.1;0.8;0.1"/></line>
      <line x1="-70" y1="6" x2="-50" y2="6" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" opacity="0.7"><animate attributeName="opacity" dur="0.6s" repeatCount="indefinite" begin="-0.3s" values="0.1;0.8;0.1"/></line>
    </g>
    <text x="100" y="142" text-anchor="middle" class="t">RIDE</text>
    <text x="100" y="162" text-anchor="middle" class="c">long roads, no agenda</text>
  </g>
</svg>
