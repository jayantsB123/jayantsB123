<svg xmlns="http://www.w3.org/2000/svg" width="352" height="137" viewBox="0 0 352 137"><title>RegisterRover</title><style>text{font-family:system-ui,sans-serif}.mono{font:11px monospace;letter-spacing:1px}.scan{animation:scan 7s ease-in-out infinite}.packet{animation:packet 3s ease-in-out infinite}.line{animation:line 3s ease-in-out infinite}@keyframes scan{0%,12%{transform:translateX(0px);opacity:0}16%{opacity:.7}78%{opacity:.7}88%,100%{transform:translateX(700px);opacity:0}}@keyframes packet{0%,15%{transform:translateX(0);opacity:.1}25%{opacity:1}75%,100%{transform:translateX(75px);opacity:.1}}@keyframes line{0%,15%{transform:translateY(0);opacity:.25}50%{opacity:1}80%,100%{transform:translateY(23px);opacity:.25}}@media(prefers-reduced-motion:reduce){.scan{display:none}.packet,.line{animation:none}}</style><rect x="1" y="1" width="350" height="135" rx="14" fill="#171927" stroke="#35384e"/><text x="20" y="33" class="mono" fill="#84e6d2">REACT · PYTHON</text><path d="M281 22h-8v8m32-8h8v8m0 13v8h-8m-24 0h-8v-8" fill="none" stroke="#75c9bd" stroke-width="2"/><path class="line" d="M274 25h38" stroke="#94ffe5" stroke-width="2.5"/><text x="19" y="79" font-size="25" font-weight="700" fill="#f0efff">RegisterRover</text><text x="20" y="109" font-size="14" fill="#bfc4d8">Camera-based attendance tracking</text><text x="315" y="110" fill="#84e6d2" font-size="19">↗</text></svg>
