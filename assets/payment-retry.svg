<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" width="760" height="242" role="img" aria-labelledby="title desc">
<title id="title">Sentinel-Ledger · one transfer, two requests</title><desc id="desc">A new transfer passes a cache check, a lock and recheck, and a database lookup before the ledger write. A matching retry with a completed cached result returns that result.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#edf0fb}.caption{font:600 11px monospace;letter-spacing:1px;fill:#b3b9d1}.label{font-size:15px;font-weight:600}.trace{fill:none;stroke-dasharray:6 16;animation:flow 2s linear infinite}@keyframes flow{to{stroke-dashoffset:-44}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}@keyframes visit{0%,100%{stroke-opacity:0}4%,12%{stroke-opacity:1}19%,99%{stroke-opacity:0}}.visit{fill:none;stroke-width:2.5;stroke-opacity:0;animation:visit 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.visit{animation:none}}</style>
<rect x="1" y="1" width="758" height="240" rx="18" fill="#151724" stroke="#393a52"/><circle cx="24" cy="25" r="4" fill="#bfaaff"/><circle cx="38" cy="25" r="4" fill="#73dfc9"/><text x="57" y="29" class="caption">SENTINEL-LEDGER / REQUEST TRACE</text>
<text x="23" y="66" font-size="25" font-weight="700">One transfer, two requests</text>
<path d="M24 83h711" stroke="#35384b"/>
<g font-size="14"><text x="24" y="122" fill="#cbb7ff" font-weight="700">First request</text><text x="24" y="146" class="caption">NEW KEY</text><text x="24" y="196" fill="#8bead6" font-weight="700">Matching retry</text><text x="24" y="219" class="caption">AFTER COMPLETION</text></g>
<path d="M169 130H707" stroke="#695b91" stroke-width="2"/><path class="trace" d="M169 130H707" stroke="#c8acff" stroke-width="3"/>
<rect x="170" y="109" width="102" height="42" rx="8" fill="#282337" stroke="#665482"/><rect x="170" y="109" width="102" height="42" rx="8" class="visit" stroke="#d2baff" style="animation-delay:0s"/><text x="221" y="135" text-anchor="middle" class="label">Cache miss</text><rect x="310" y="109" width="132" height="42" rx="8" fill="#282337" stroke="#665482"/><rect x="310" y="109" width="132" height="42" rx="8" class="visit" stroke="#d2baff" style="animation-delay:0.8s"/><text x="376" y="135" text-anchor="middle" class="label">Lock + recheck</text><rect x="486" y="109" width="104" height="42" rx="8" fill="#282337" stroke="#665482"/><rect x="486" y="109" width="104" height="42" rx="8" class="visit" stroke="#d2baff" style="animation-delay:1.6s"/><text x="538" y="135" text-anchor="middle" class="label">DB lookup</text><rect x="632" y="109" width="104" height="42" rx="8" fill="#282337" stroke="#665482"/><rect x="632" y="109" width="104" height="42" rx="8" class="visit" stroke="#d2baff" style="animation-delay:2.4s"/><text x="684" y="135" text-anchor="middle" class="label">Write ledger</text>
<path d="M170 200h390" stroke="#407b71" stroke-width="2"/><path class="trace" d="M170 200h390" stroke="#8bead6" stroke-width="3"/>
<rect x="170" y="179" width="112" height="42" rx="8" fill="#192f32" stroke="#396961"/><rect x="170" y="179" width="112" height="42" rx="8" class="visit" stroke="#84efd7" style="animation-delay:4s"/><text x="226" y="205" text-anchor="middle" class="label">Cache hit</text><rect x="320" y="179" width="158" height="42" rx="8" fill="#192f32" stroke="#396961"/><rect x="320" y="179" width="158" height="42" rx="8" class="visit" stroke="#84efd7" style="animation-delay:4.8s"/><text x="399" y="205" text-anchor="middle" class="label">Match fingerprint</text><rect x="522" y="179" width="214" height="42" rx="8" fill="#192f32" stroke="#396961"/><rect x="522" y="179" width="214" height="42" rx="8" class="visit" stroke="#84efd7" style="animation-delay:5.6s"/><text x="629" y="205" text-anchor="middle" class="label">Return saved response</text></svg>
