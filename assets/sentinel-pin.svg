<svg xmlns="http://www.w3.org/2000/svg" width="352" height="137" viewBox="0 0 352 137"><title>Sentinel-Ledger</title><style>text{font-family:system-ui,sans-serif}.mono{font:11px monospace;letter-spacing:1px}.scan{animation:scan 7s ease-in-out infinite}.packet{animation:packet 3s ease-in-out infinite}.line{animation:line 3s ease-in-out infinite}@keyframes scan{0%,12%{transform:translateX(0px);opacity:0}16%{opacity:.7}78%{opacity:.7}88%,100%{transform:translateX(700px);opacity:0}}@keyframes packet{0%,15%{transform:translateX(0);opacity:.1}25%{opacity:1}75%,100%{transform:translateX(75px);opacity:.1}}@keyframes line{0%,15%{transform:translateY(0);opacity:.25}50%{opacity:1}80%,100%{transform:translateY(23px);opacity:.25}}@media(prefers-reduced-motion:reduce){.scan{display:none}.packet,.line{animation:none}}</style><rect x="1" y="1" width="350" height="135" rx="14" fill="#171927" stroke="#35384e"/><text x="20" y="33" class="mono" fill="#c7a3ff">JAVA · SPRING BOOT</text><path d="M226 41h92" stroke="#786197" stroke-width="2"/><g fill="#c7a3ff"><circle cx="226" cy="41" r="4"/><circle cx="316" cy="41" r="4"/></g><circle class="packet" cx="231" cy="41" r="5" fill="#91f4df"/><text x="19" y="79" font-size="25" font-weight="700" fill="#f0efff">Sentinel-Ledger</text><text x="20" y="109" font-size="14" fill="#bfc4d8">Retry-safe double-entry payments</text><text x="315" y="110" fill="#c7a3ff" font-size="19">↗</text></svg>
